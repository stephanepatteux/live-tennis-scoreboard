<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Live Tennis Scoreboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">🎾 Live Tennis Scoreboard</a>
    <nav>
      <a href="{{ url_for('index') }}">Scoreboard</a>
      <a href="{{ url_for('status_page') }}">Status</a>
      <a href="{{ url_for('help_page') }}">Help</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
